<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Gestión Bisonte</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070d19; /* Fondo oscuro por si tarda en cargar el iframe */
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/a/macros/app-bisonte.com.mx/s/AKfycbzTmZMMbjgppKysvZgpNFF0y8p-Ien7J_K8RoyoiLiiJc8fzmuLOBJAMBYu-Zvs-uri/exec"></iframe>

  <!-- =========================================================
       ESCUDO ANTI-INSPECCIÓN PARA EL DOMINIO PRINCIPAL
  ========================================================= -->
  <script>
    // Bloquea el clic derecho
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    // Bloquea teclas de herramientas de desarrollador
    document.addEventListener('keydown', function(e) {
      // Bloquea F12
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
      }
      // Bloquea Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
        e.preventDefault();
      }
      // Bloquea Ctrl+U (Ver código fuente)
      if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
